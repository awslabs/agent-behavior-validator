[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-behavioral-contracts"
version = "0.2.0"
description = "Behavioral validation toolkit for AI agents in regulated environments. Checks whether agents follow the correct process — not just whether they produce correct outputs."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = [
    "ai",
    "agents",
    "behavioral-validation",
    "compliance",
    "otel",
    "opentelemetry",
    "regulated",
    "fintech",
    "healthcare",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "agentic-otel>=0.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
cloudwatch = [
    "boto3>=1.34.0",
]

[project.urls]
Homepage = "https://github.com/awslabs/agent-behavior-validator"
Repository = "https://github.com/awslabs/agent-behavior-validator"
Issues = "https://github.com/awslabs/agent-behavior-validator/issues"
Changelog = "https://github.com/awslabs/agent-behavior-validator/blob/main/packages/agentic-behavioral-contracts/CHANGELOG.md"

[project.scripts]
agent-validate = "agent_validator.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_validator"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agent_validator",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
