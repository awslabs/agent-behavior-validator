[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-otel"
version = "0.1.0"
description = "Normalization layer for OpenTelemetry GenAI agent traces. Single parsing pass, framework detection, span classification with confidence scores."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = [
    "ai",
    "agents",
    "otel",
    "opentelemetry",
    "traces",
    "normalization",
    "genai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/awslabs/agent-behavior-validator"
Repository = "https://github.com/awslabs/agent-behavior-validator"
Issues = "https://github.com/awslabs/agent-behavior-validator/issues"
Changelog = "https://github.com/awslabs/agent-behavior-validator/blob/main/packages/agentic-otel/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_otel"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agentic_otel",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
