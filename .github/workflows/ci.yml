name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.package }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [agentic-behavioral-contracts, agentic-otel]
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # agentic-behavioral-contracts depends on agentic-otel. Install the
      # sibling from source so CI validates this tree rather than resolving
      # the dependency from PyPI (which also keeps CI green before the first
      # agentic-otel release, and honest afterwards).
      - name: Install sibling package from source
        if: matrix.package == 'agentic-behavioral-contracts'
        run: python -m pip install --upgrade pip && python -m pip install -e ../agentic-otel

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    name: build distributions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [agentic-behavioral-contracts, agentic-otel]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Verify distribution metadata
        run: python -m twine check dist/*

  security-scan:
    name: security scan (ASH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false  # no lockfile to key a cache on
      - name: Run Automated Security Helper
        run: |
          uvx "git+https://github.com/awslabs/automated-security-helper.git@v3.5.8" \
            --source-dir . --output-dir ash_output --mode local
      - name: Upload ASH report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ash-report
          path: ash_output/reports/
