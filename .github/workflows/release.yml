name: Release to PyPI

# Tag-triggered release. Tag format selects the package:
#   agentic-behavioral-contracts-v0.2.0
#   agentic-otel-v0.1.0
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no long-lived API tokens
# are stored in this repository. PyPI records PEP 740 provenance attestations
# for every upload, and the build step additionally produces GitHub artifact
# attestations for the distributions.
#
# One-time setup per package on PyPI:
#   Publishing → Add a pending publisher:
#     Owner: awslabs
#     Repository: agent-behavior-validator
#     Workflow: release.yml
#     Environment: pypi

on:
  push:
    tags:
      - "agentic-behavioral-contracts-v*"
      - "agentic-otel-v*"

permissions:
  contents: read

jobs:
  resolve:
    name: resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG##*-v}"
          PACKAGE="${TAG%-v$VERSION}"
          if [ ! -d "packages/$PACKAGE" ] && [ "$PACKAGE" != "agentic-behavioral-contracts" ] && [ "$PACKAGE" != "agentic-otel" ]; then
            echo "::error::Tag '$TAG' does not resolve to a known package"; exit 1
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $PACKAGE $VERSION"

  build:
    name: build and attest
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required for artifact attestations
      attestations: write  # required for artifact attestations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build distributions
        working-directory: packages/${{ needs.resolve.outputs.package }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify tag version matches package metadata
        working-directory: packages/${{ needs.resolve.outputs.package }}
        run: |
          EXPECTED="${{ needs.resolve.outputs.version }}"
          FOUND=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$EXPECTED" != "$FOUND" ]; then
            echo "::error::Tag version $EXPECTED does not match pyproject version $FOUND"; exit 1
          fi

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: packages/${{ needs.resolve.outputs.package }}/dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ needs.resolve.outputs.package }}
          path: packages/${{ needs.resolve.outputs.package }}/dist/

  publish:
    name: publish to PyPI
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # required for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ needs.resolve.outputs.package }}
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
