version: 2

# Cooldown periods deliberately delay adoption of freshly published versions.
# A compromised maintainer account can publish a malicious release; waiting
# lets the ecosystem detect and yank it before we take the bump. Majors wait
# longer because they carry the most behavioural change alongside the risk.
updates:
  # Python dependencies, one entry per package in the monorepo
  - package-ecosystem: pip
    directory: /packages/agentic-behavioral-contracts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /packages/agentic-otel
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]

  # GitHub Actions are pinned to commit SHAs for supply-chain integrity;
  # Dependabot proposes SHA bumps with the version comment updated, so
  # upgrades arrive as reviewed PRs that CI validates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
