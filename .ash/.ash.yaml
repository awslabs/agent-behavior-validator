# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: agent-behavior-validator
global_settings:
  severity_threshold: MEDIUM
  suppressions:
    - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
      path: "packages/agentic-otel/tests/traces/*.json"
      reason: >-
        Synthetic OpenTelemetry trace fixtures used as offline test data. The
        flagged high-entropy strings are OTEL trace/span identifiers (hex) in
        hand-authored or sanitized example traces. No credentials, tokens, or
        account identifiers are present; all content is synthetic.
    - rule_id: SECRET-BASE64-HIGH-ENTROPY-STRING
      path: "packages/agentic-otel/tests/traces/*.json"
      reason: >-
        Same fixtures as above: OTEL identifiers and synthetic span payload
        content in test trace files. No secrets.
